meta:
  name: Visual Novel Pack
  author: julie

vars:
  - authors:
      type: enum
      values:
        - Author 1
        - Author 2

enums:
  - name: interpolation
    values:
    - EASE_IN
    - EASE_OUT
    - EASE_IN_OUT
    - LINEAR

nodes:
  - type: category
    name: Basic
    tooltip: The most basic and intuitive nodes for VN creation.
    content:
      - type: node
        name: Talk
        tooltip: Makes the given character say something.
        components:
          - type: Label
            text: Dialogue
            ports:
              left: true
              right: true
          - name: Dialogue
            type: TextEdit
            placeholder: Add dialogue here...
          - type: Label
            text: Author
          - name: Author
            type: Dropdown
            enum: vars/authors
      - type: node
        name: Choice2
        tooltip: Gives a choice between 2 options.
        components:
          - name: Label1
            type: Label
            text: Option 1
            ports:
              left: true
          - name: Option1
            type: LineEdit
            ports:
              right: true
          - name: Label2
            type: Label
            text: Option 2
          - name: Option2
            type: LineEdit
            ports:
              right: true

  - type: category
    name: Advanced
    tooltip: More complicated nodes for making Visual Novels.
    content:
      - type: node
        name: Tunnel Entrance
        tooltip: Entrance for a Tunnel.
        components:
          - type: Label
            text: Tunnel name
            ports:
              left: true
          - type: LineEdit
            name: TunnelName
            placeholder: Name...
      - type: node
        name: Tunnel Exit
        tooltip: Exit for a Tunnel.
        components:
          - type: Label
            text: Tunnel name
            ports:
              right: true
          - type: LineEdit
            name: TunnelName
            placeholder: Name...

  - type: category
    name: Control
    tooltip: Nodes that control how nodes themselves interact.
    content:
      - type: node
        name: Start
        tooltip: The beginning of execution for the Event.
        is_event_start: true
        components:
          - type: Label
            text: Event Start
            ports:
              right: true
      - type: node
        name: Comment
        tooltip: A node with no purpose other than providing context for anyone reading the graph.
        export: false
        components:
          - type: TextEdit
            name: Comment
            placeholder: Comment...
